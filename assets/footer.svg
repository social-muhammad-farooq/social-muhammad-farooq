<g class="s"><text x="500" y="86" text-anchor="middle" font-family="'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="1" fill="#93c5fd">Open to remote roles · freelance · contract-to-hire</text></g>
